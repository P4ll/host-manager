[package]
name = "host-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
anyhow = "1"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
